name: bano_qabil_student_app

description: "A campus app for free IT courses — apply, attend class, submit work, and see if you are job-ready."

publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.12.2

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    shared_preferences: ^2.5.3

    # Firebase
    firebase_core: ^3.15.2
    firebase_auth: ^5.4.1
    cloud_firestore: ^5.6.12
    firebase_storage: ^12.4.0

    # State Management
    provider: ^6.1.1

    # Utilities
    intl: ^0.19.0

    # Images & Files
    cached_network_image: ^3.3.1
    file_picker: ^11.0.3
    image_picker: ^1.1.2

    # UI Components
    table_calendar: ^3.1.2
    percent_indicator: ^4.2.3

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/images/bano_qabil_logo.png